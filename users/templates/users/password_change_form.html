{% extends "base.html" %}
{% load widget_tweaks %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="width: 420px; border-radius: 16px;">
        <h3 class="text-center mb-4">Смена пароля</h3>

        <form method="post">
            {% csrf_token %}
            
            {% for f in form %}
                <div class="mb-3">
                    <label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>
                    {{ f|add_class:"form-control" }}
                    {% if f.errors %}
                        <div class="text-danger small">{{ f.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-primary w-100 mt-2">Сменить пароль</button>
            <div class="text-center mt-3">
                <small><a href="{% url 'home' %}" class="text-decoration-none">Отмена</a></small>
            </div>
        </form>
    </div>
</div>
{% endblock %}
