{% extends "base.html" %}
{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card shadow-lg p-4 text-center" style="width: 420px; border-radius: 16px;">

        <h3 class="mb-3">Письмо отправлено</h3>

        <p class="text-muted mb-4">
            Если указанный email существует в нашей системе, на него отправлено письмо
            со ссылкой для восстановления пароля.
            <br>
            Проверьте почту и следуйте инструкции.
        </p>

        <a href="{% url 'users:login' %}" class="btn btn-primary w-100">
            Вернуться ко входу
        </a>
    </div>
</div>

{% endblock %}
